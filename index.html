<!doctype html>
<html lang="ka" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>საქართველოს ავტოგზების რუკა | car.qgis.ge</title>
<meta name="description" content="საქართველოს საავტომობილო გზების ინტერაქტიული რუკა — საერთაშორისო (S) და შიდასახელმწიფოებრივი (Sh) მარშრუტები, რეგიონები და ადმინისტრაციული საზღვარი. GIS GEORGIA.">
<meta name="keywords" content="საქართველოს გზები, ავტოგზები, ავტორუკა, საავტომობილო გზები, roads of Georgia, GIS Georgia, car.qgis.ge">
<meta name="author" content="GIS GEORGIA">
<meta property="og:type" content="website">
<meta property="og:title" content="საქართველოს ავტოგზების რუკა">
<meta property="og:description" content="საქართველოს საავტომობილო გზების ინტერაქტიული რუკა — საერთაშორისო და შიდასახელმწიფოებრივი მარშრუტები.">
<meta property="og:url" content="https://car.qgis.ge/">
<meta name="theme-color" content="#0d1b2a">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb; --panel:#ffffff; --panel-brd:#e3e9f2; --text:#12263a; --muted:#5c7189;
  --accent:#34c759; --accent2:#2aa2ff; --intl:#e5484d; --intl2:#f2a00d; --shadow:0 8px 26px rgba(20,40,70,.14);
}
html[data-theme="dark"]{
  --bg:#0d1b2a; --panel:#132639; --panel-brd:#254161; --text:#eaf2fb; --muted:#9fb6cf;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
body{font-family:"Noto Sans Georgian",system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
#map{position:absolute;inset:0}

/* top bar */
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 12px;pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--panel-brd);border-radius:12px;padding:8px 13px;box-shadow:var(--shadow);font-weight:800;font-size:15px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(52,199,89,.18)}
.spacer{flex:1}
.tbtn{pointer-events:auto;cursor:pointer;background:var(--panel);border:1px solid var(--panel-brd);color:var(--text);
  border-radius:12px;padding:9px 13px;font-family:inherit;font-weight:700;font-size:14px;box-shadow:var(--shadow);
  display:inline-flex;align-items:center;gap:7px;transition:transform .12s,border-color .12s}
.tbtn:hover{transform:translateY(-1px);border-color:var(--accent)}
.tbtn.fines{background:var(--accent);border-color:var(--accent);color:#04210f}
.tbtn.fines:hover{filter:brightness(1.05)}
a.tbtn{text-decoration:none}

/* search */
.searchwrap{position:absolute;top:62px;left:12px;z-index:19;width:min(340px,calc(100vw - 24px))}
.searchwrap .fld{position:relative}
.searchwrap input{width:100%;padding:12px 40px 12px 40px;border-radius:12px;border:1px solid var(--panel-brd);
  background:var(--panel);color:var(--text);font-size:15px;font-family:inherit;outline:none;box-shadow:var(--shadow)}
.searchwrap input:focus{border-color:var(--accent2)}
.searchwrap .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchwrap .cl{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);
  font-size:18px;cursor:pointer;display:none}
.results{margin-top:6px;background:var(--panel);border:1px solid var(--panel-brd);border-radius:12px;box-shadow:var(--shadow);
  overflow:hidden;display:none;max-height:min(50vh,360px);overflow-y:auto}
.results.on{display:block}
.results button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--panel-brd);color:var(--text);
  font-family:inherit;font-size:14px;padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:flex-start}
.results button:last-child{border-bottom:0}
.results button:hover{background:rgba(42,162,255,.09)}
.results .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.intl{background:rgba(229,72,77,.14);color:var(--intl)}
.tag.sh{background:rgba(242,160,13,.16);color:var(--intl2)}
.tag.reg{background:rgba(42,162,255,.14);color:var(--accent2)}

/* legend / layers panel */
.panel{position:absolute;left:12px;bottom:26px;z-index:18;background:var(--panel);border:1px solid var(--panel-brd);
  border-radius:14px;box-shadow:var(--shadow);width:min(270px,calc(100vw - 24px));overflow:hidden}
.panel .hd{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;font-weight:800;font-size:14px}
.panel .bd{padding:4px 14px 14px;display:block}
.panel.collapsed .bd{display:none}
.panel .grp{margin-top:10px}
.panel .grp:first-child{margin-top:2px}
.panel .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:2px 0 7px}
.row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px;cursor:pointer;user-select:none}
.row .sw{width:22px;height:5px;border-radius:3px;flex:none}
.row .sw.box{height:14px;width:14px;border-radius:4px}
.row input{accent-color:var(--accent);width:16px;height:16px;margin:0 0 0 auto}
.seg{display:flex;gap:5px;margin-top:4px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;border:1px solid var(--panel-brd);background:transparent;color:var(--muted);
  font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}

/* map label markers */
.mk-reg{font-weight:700;font-size:12px;color:var(--text);text-shadow:0 1px 3px var(--bg),0 0 2px var(--bg);pointer-events:none;white-space:nowrap}
.mk-reg.occ{color:#e5484d}
html[data-theme="dark"] .mk-reg{text-shadow:0 1px 4px #000,0 0 3px #000}
html[data-theme="dark"] .mk-reg.occ{color:#ff7a7d}
.mk-road{pointer-events:none;background:var(--intl);color:#fff;font-weight:800;font-size:10.5px;padding:1px 6px;border-radius:999px;
  box-shadow:0 1px 4px rgba(0,0,0,.4);white-space:nowrap}
.mk-road.sh{background:var(--intl2);color:#1a1200}

/* popup */
.maplibregl-popup-content{font-family:"Noto Sans Georgian",sans-serif;border-radius:12px;padding:0;overflow:hidden;
  box-shadow:var(--shadow);background:var(--panel);color:var(--text);border:1px solid var(--panel-brd)}
.pp{min-width:190px}
.pp .t{padding:10px 14px;font-weight:800;font-size:14px;color:#fff}
.pp .t.intl{background:linear-gradient(90deg,var(--intl),#ff7a7d)}
.pp .t.sh{background:linear-gradient(90deg,var(--intl2),#ffc55e);color:#241800}
.pp .t.reg{background:linear-gradient(90deg,var(--accent2),#6ec8ff)}
.pp .b{padding:10px 14px;font-size:13px;color:var(--muted)}
.pp .b b{color:var(--text)}
.maplibregl-popup-close-button{font-size:20px;color:#fff;padding:2px 8px}
.pp .t.sh + .maplibregl-popup-close-button{color:#241800}

/* fines btn bottom-right (mobile) */
.fab{position:absolute;right:12px;bottom:26px;z-index:18;display:none}
@media(max-width:720px){
  .brand span.full{display:none}
  .tbtn .full{display:none}
  .topbar .fines{display:none}
  .fab{display:block}
}
.maplibregl-ctrl-attrib{font-size:10px}
.loader{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:var(--bg);
  transition:opacity .4s;font-weight:700;color:var(--muted);gap:12px}
.loader.hide{opacity:0;pointer-events:none}
.spin{width:22px;height:22px;border:3px solid var(--panel-brd);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="map"></div>

<div class="loader" id="loader"><div class="spin"></div><span>რუკა იტვირთება…</span></div>

<div class="topbar">
  <div class="brand"><span class="dot"></span>🚗 <span class="full">საქართველოს ავტოგზების რუკა</span></div>
  <div class="spacer"></div>
  <button class="tbtn" id="themeBtn" title="თემა">🌙 <span class="full">თემა</span></button>
  <a class="tbtn fines" href="jarimebi.html" title="საგზაო ჯარიმები — შემოწმება, გადახდა და კოდექსი">🚦 <span class="full">საგზაო ჯარიმები</span></a>
</div>

<a class="tbtn fines fab" href="jarimebi.html" title="საგზაო ჯარიმები">🚦 ჯარიმები</a>

<div class="searchwrap">
  <div class="fld">
    <span class="ic">🔎</span>
    <input id="search" type="search" autocomplete="off" placeholder="გზის ან რეგიონის ძებნა…" aria-label="ძებნა">
    <button class="cl" id="searchClr" aria-label="გასუფთავება">✕</button>
  </div>
  <div class="results" id="results"></div>
</div>

<div class="panel" id="panel">
  <div class="hd" id="panelHd"><span>🗂️ შრეები და ლეგენდა</span><span id="panelChev">▾</span></div>
  <div class="bd">
    <div class="grp">
      <div class="lbl">საბაზისო რუკა</div>
      <div class="seg" id="baseSeg">
        <button data-base="light" class="on">ღია</button>
        <button data-base="dark">მუქი</button>
        <button data-base="sat">სატელიტი</button>
      </div>
    </div>
    <div class="grp">
      <div class="lbl">❄️ ზამთრის გზები</div>
      <div class="row" data-layer="roads-intl"><span class="sw" style="background:#e5484d"></span> საერთაშორისო მარშრუტები (S) <input type="checkbox" checked></div>
      <div class="row" data-layer="roads-sh"><span class="sw" style="background:#f5a623"></span> შიდასახელმწიფოებრივი (Sh) <input type="checkbox" checked></div>
    </div>
    <div class="grp">
      <div class="lbl">ტერიტორია</div>
      <div class="row" data-layer="regions"><span class="sw box" style="background:rgba(91,143,249,.5)"></span> რეგიონები <input type="checkbox" checked></div>
      <div class="row" data-layer="border"><span class="sw" style="background:#8493a8"></span> ქვეყნის საზღვარი <input type="checkbox" checked></div>
      <div class="row" style="cursor:default"><span class="sw box" style="background:repeating-linear-gradient(-45deg,#e5484d 0 1.5px,transparent 1.5px 5px);border:1px solid #e5484d"></span> ოკუპირებული ტერიტორია <span style="margin-left:auto">🔒</span></div>
    </div>
    <div class="grp">
      <div class="lbl">წარწერები</div>
      <div class="row" data-layer="lbl-reg"><span>რეგიონების სახელები</span> <input type="checkbox" checked></div>
      <div class="row" data-layer="lbl-road"><span>გზების ნომრები</span> <input type="checkbox"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data/REGIONI_3.js"></script>
<script src="data/GEORGIA_4.js"></script>
<script src="data/roads_5.js"></script>
<script>
(function(){
  "use strict";
  var REGION_KA={
    'Ajara':'აჭარა','Apkhazeti':'აფხაზეთი','Guria':'გურია','Imereti':'იმერეთი','Kakheti':'კახეთი',
    'Kvemo Kartli':'ქვემო ქართლი','Mtskheta-Mtianeti':'მცხეთა-მთიანეთი',
    'Racha-Lechkumi kvemo Svaneti':'რაჭა-ლეჩხუმი და ქვ. სვანეთი','Samegrelo-zemo Svaneti':'სამეგრელო-ზემო სვანეთი',
    'Samtskhe-Javakheti':'სამცხე-ჯავახეთი','Shida Kartli':'შიდა ქართლი','South Ossetia':'შიდა ქართლი','Tbilisi':'თბილისი'
  };
  var OCCUPIED={'South Ossetia':1,'Apkhazeti':1};
  var REGION_COLORS=['#5B8FF9','#5AD8A6','#5D7092','#F6BD16','#E8684A','#6DC8EC','#9270CA','#FF9D4D','#269A99','#FF99C3','#7DA8FF','#B5E48C','#C3A5E6'];

  // ---- prepare data ----
  var roads=(typeof json_roads_5!=='undefined')?json_roads_5:{type:'FeatureCollection',features:[]};
  var regions=(typeof json_REGIONI_3!=='undefined')?json_REGIONI_3:{type:'FeatureCollection',features:[]};
  var border=(typeof json_GEORGIA_4!=='undefined')?json_GEORGIA_4:{type:'FeatureCollection',features:[]};

  roads.features.forEach(function(f){
    var nm=(f.properties.Name||'').trim();
    var parts=nm.split(/\s+/);
    var route=parts.length>1?parts[parts.length-1]:nm;
    var seg=parts.length>1?parts.slice(0,-1).join(' '):'';
    var intl=!/^Sh/i.test(route) && /^S/i.test(route);
    f.properties.route=route; f.properties.seg=seg;
    f.properties.kind=intl?'intl':'sh';
  });
  var idx=0;
  regions.features.forEach(function(f){
    var eng=f.properties.REGION_ENG||'';
    var occ=!!OCCUPIED[eng];
    f.properties.occupied=occ;
    f.properties.name_ka=REGION_KA[eng]||eng;
    f.properties.color=occ?'#9aa4b2':REGION_COLORS[idx%REGION_COLORS.length];
    if(!occ) idx++;
  });

  function bbox(geom){
    var mnx=180,mny=90,mxx=-180,mxy=-90;
    (function walk(c){ if(typeof c[0]==='number'){ if(c[0]<mnx)mnx=c[0];if(c[0]>mxx)mxx=c[0];if(c[1]<mny)mny=c[1];if(c[1]>mxy)mxy=c[1];} else c.forEach(walk);})(geom.coordinates);
    return [mnx,mny,mxx,mxy];
  }
  function center(geom){ var b=bbox(geom); return [(b[0]+b[2])/2,(b[1]+b[3])/2]; }
  function midline(geom){
    var line=geom.type==='MultiLineString'?geom.coordinates[Math.floor(geom.coordinates.length/2)]:geom.coordinates;
    return line[Math.floor(line.length/2)];
  }

  // diagonal red hatch for occupied territories (tiles seamlessly)
  function makeHatch(){
    var s=6,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d');
    x.strokeStyle='rgba(214,40,45,0.95)';x.lineWidth=1.5;x.lineCap='square';
    x.beginPath();x.moveTo(0,s);x.lineTo(s,0);x.stroke();
    return x.getImageData(0,0,s,s);
  }

  // ---- base styles ----
  function raster(tiles,attr){return {version:8,sources:{base:{type:'raster',tiles:tiles,tileSize:256,attribution:attr}},layers:[{id:'base',type:'raster',source:'base'}]};}
  var CARTO='&copy; <a href="https://openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank">CARTO</a>';
  var STYLES={
    light:raster(['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png','https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'],CARTO),
    dark:raster(['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png','https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'],CARTO),
    sat:raster(['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],'Imagery &copy; <a href="https://www.esri.com" target="_blank">Esri</a>')
  };

  var map=new maplibregl.Map({
    container:'map', style:STYLES.light, center:[43.6,42.0], zoom:6.4, attributionControl:false, maxZoom:16
  });
  map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'<a href="https://qgis.ge" target="_blank">GIS GEORGIA</a>'}));
  map.addControl(new maplibregl.NavigationControl({visualizePitch:false}),'bottom-right');
  map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}),'bottom-right');
  map.addControl(new maplibregl.ScaleControl({maxWidth:110,unit:'metric'}),'bottom-left');
  map.addControl(new maplibregl.FullscreenControl(),'bottom-right');

  var vis={'roads-intl':true,'roads-sh':true,'regions':true,'border':true};
  var lblReg=true, lblRoad=false;

  function addOverlays(){
    if(!map.getSource('regions')) map.addSource('regions',{type:'geojson',data:regions});
    if(!map.getSource('roads')) map.addSource('roads',{type:'geojson',data:roads});
    if(!map.getSource('border')) map.addSource('border',{type:'geojson',data:border});

    if(!map.hasImage('hatch')){ try{ map.addImage('hatch',makeHatch(),{pixelRatio:1}); }catch(e){} }

    if(!map.getLayer('regions-fill')) map.addLayer({id:'regions-fill',type:'fill',source:'regions',
      paint:{'fill-color':['get','color'],'fill-opacity':['case',['boolean',['feature-state','hover'],false],0.44,0.20]}});
    if(!map.getLayer('regions-occ') && map.hasImage('hatch')) map.addLayer({id:'regions-occ',type:'fill',source:'regions',
      filter:['==',['get','occupied'],true],paint:{'fill-pattern':'hatch','fill-opacity':0.85}});
    if(!map.getLayer('regions-line')) map.addLayer({id:'regions-line',type:'line',source:'regions',
      paint:{'line-color':['get','color'],'line-width':1.2,'line-opacity':0.85}});
    if(!map.getLayer('regions-occ-line')) map.addLayer({id:'regions-occ-line',type:'line',source:'regions',
      filter:['==',['get','occupied'],true],paint:{'line-color':'#e5484d','line-width':2,'line-dasharray':[2,1.6],'line-opacity':0.95}});
    if(!map.getLayer('border-line')) map.addLayer({id:'border-line',type:'line',source:'border',
      paint:{'line-color':'#8493a8','line-width':2.2,'line-opacity':0.7}});
    // road casings (halo under the coloured line)
    if(!map.getLayer('roads-sh-case')) map.addLayer({id:'roads-sh-case',type:'line',source:'roads',filter:['==',['get','kind'],'sh'],
      layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'rgba(12,22,36,0.32)','line-width':['interpolate',['linear'],['zoom'],6,3,12,7]}});
    if(!map.getLayer('roads-intl-case')) map.addLayer({id:'roads-intl-case',type:'line',source:'roads',filter:['==',['get','kind'],'intl'],
      layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'rgba(12,22,36,0.4)','line-width':['interpolate',['linear'],['zoom'],6,4,12,9]}});
    if(!map.getLayer('roads-sh')) map.addLayer({id:'roads-sh',type:'line',source:'roads',filter:['==',['get','kind'],'sh'],
      layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#f5a623','line-width':['interpolate',['linear'],['zoom'],6,1.5,12,3.8]}});
    if(!map.getLayer('roads-intl')) map.addLayer({id:'roads-intl',type:'line',source:'roads',filter:['==',['get','kind'],'intl'],
      layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#e5484d','line-width':['interpolate',['linear'],['zoom'],6,2.2,12,5.5]}});
    applyVisibility();
    wireInteractions();
  }

  function setVis(ids,on){ ids.forEach(function(l){ if(map.getLayer(l)) map.setLayoutProperty(l,'visibility',on?'visible':'none'); }); }
  function applyVisibility(){
    setVis(['roads-intl','roads-intl-case'],vis['roads-intl']);
    setVis(['roads-sh','roads-sh-case'],vis['roads-sh']);
    setVis(['regions-fill','regions-line','regions-occ','regions-occ-line'],vis['regions']);
    setVis(['border-line'],vis['border']);
  }

  // ---- HTML label markers (reliable Georgian) ----
  var regMarkers=[], roadMarkers=[];
  function buildMarkers(){
    regions.features.forEach(function(f){
      var el=document.createElement('div'); el.className='mk-reg'+(f.properties.occupied?' occ':'');
      el.textContent=(f.properties.occupied?'🔒 ':'')+f.properties.name_ka;
      regMarkers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(center(f.geometry)).addTo(map));
    });
    roads.features.forEach(function(f){
      var el=document.createElement('div'); el.className='mk-road'+(f.properties.kind==='sh'?' sh':''); el.textContent=f.properties.route;
      var m=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(midline(f.geometry));
      roadMarkers.push(m);
    });
    syncMarkers();
  }
  function syncMarkers(){
    regMarkers.forEach(function(m){ m.getElement().style.display=lblReg?'block':'none';});
    roadMarkers.forEach(function(m){ if(lblRoad){m.addTo(map);} else {m.remove();} });
  }

  // ---- interactions ----
  var hoveredReg=null, wired=false;
  function wireInteractions(){
    if(wired) return; wired=true;
    map.on('mousemove','regions-fill',function(e){
      if(!e.features.length) return; map.getCanvas().style.cursor='pointer';
      if(hoveredReg!==null) map.setFeatureState({source:'regions',id:hoveredReg},{hover:false});
      hoveredReg=e.features[0].id; map.setFeatureState({source:'regions',id:hoveredReg},{hover:true});
    });
    map.on('mouseleave','regions-fill',function(){ map.getCanvas().style.cursor='';
      if(hoveredReg!==null) map.setFeatureState({source:'regions',id:hoveredReg},{hover:false}); hoveredReg=null;});
    map.on('click','regions-fill',function(e){ var p=e.features[0].properties;
      var occ=(p.occupied===true||p.occupied==='true');
      var b='რეგიონი · <b>'+(p.REGION_ENG||'')+'</b>';
      if(occ) b+='<br><span style="color:var(--intl);font-weight:800">⚠️ ოკუპირებული ტერიტორია</span><br><span style="font-size:11px">საქართველოს კანონი „ოკუპირებული ტერიტორიების შესახებ"</span>';
      popup('reg','<div class="pp"><div class="t reg">'+(occ?'🔒 ':'📍 ')+(p.name_ka||p.REGION_ENG)+'</div><div class="b">'+b+'</div></div>',e.lngLat);});
    ['roads-intl','roads-sh'].forEach(function(id){
      map.on('mouseenter',id,function(){map.getCanvas().style.cursor='pointer';});
      map.on('mouseleave',id,function(){map.getCanvas().style.cursor='';});
      map.on('click',id,function(e){ var p=e.features[0].properties; var sh=p.kind==='sh';
        popup(sh?'sh':'intl','<div class="pp"><div class="t '+(sh?'sh':'intl')+'">🛣️ '+p.route+'</div><div class="b">❄️ ზამთრის გზა · '+(sh?'შიდასახელმწიფოებრივი მარშრუტი':'საერთაშორისო მარშრუტი')+(p.seg?' · მონაკვეთი <b>'+p.seg+'</b>':'')+'</div></div>',e.lngLat);});
    });
  }
  var curPopup=null;
  function popup(kind,html,lngLat){ if(curPopup)curPopup.remove();
    curPopup=new maplibregl.Popup({closeButton:true,maxWidth:'280px'}).setLngLat(lngLat).setHTML(html).addTo(map);}

  // regions need feature ids for hover state
  regions.features.forEach(function(f,i){ f.id=i; });

  function hideLoader(){ var l=document.getElementById('loader'); if(l) l.classList.add('hide'); }
  map.on('load',function(){
    addOverlays(); buildMarkers();
    try{ var bb=bbox(border.features[0].geometry); map.fitBounds([[bb[0],bb[1]],[bb[2],bb[3]]],{padding:{top:78,bottom:94,left:64,right:64},duration:0}); }catch(e){ try{ map.fitBounds([[39.9,41.0],[46.8,43.6]],{padding:40,duration:0}); }catch(e2){} }
    hideLoader();
  });
  map.on('idle',hideLoader);   // definitely rendered
  setTimeout(hideLoader,6000); // failsafe so the loader never sticks

  // ---- base switching ----
  var curBase='light';
  function setBase(b){
    if(b===curBase) return; curBase=b;
    document.querySelectorAll('#baseSeg button').forEach(function(x){x.classList.toggle('on',x.dataset.base===b);});
    if(b==='dark'||b==='sat'){ document.documentElement.setAttribute('data-theme','dark'); }
    else { document.documentElement.setAttribute('data-theme','light'); }
    map.setStyle(STYLES[b]);
    map.once('styledata',function(){ addOverlays(); syncMarkers(); });
  }
  document.getElementById('baseSeg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(b) setBase(b.dataset.base);
  });

  // theme button toggles light<->dark base
  document.getElementById('themeBtn').addEventListener('click',function(){
    setBase(curBase==='light'?'dark':'light');
    this.textContent=''; this.appendChild(document.createTextNode(curBase==='light'?'🌙 ':'☀️ '));
    var s=document.createElement('span'); s.className='full'; s.textContent='თემა'; this.appendChild(s);
  });

  // layer toggles
  document.querySelectorAll('.panel .row[data-layer]').forEach(function(row){
    row.addEventListener('click',function(e){
      var cb=row.querySelector('input'); if(e.target!==cb) cb.checked=!cb.checked;
      var k=row.dataset.layer; var on=cb.checked;
      if(k==='lbl-reg'){ lblReg=on; syncMarkers(); }
      else if(k==='lbl-road'){ lblRoad=on; syncMarkers(); }
      else { vis[k]=on; applyVisibility(); }
    });
  });

  // panel collapse
  document.getElementById('panelHd').addEventListener('click',function(){
    var p=document.getElementById('panel'); p.classList.toggle('collapsed');
    document.getElementById('panelChev').textContent=p.classList.contains('collapsed')?'▸':'▾';
  });

  // ---- search ----
  var searchIndex=[];
  roads.features.forEach(function(f){ searchIndex.push({type:f.properties.kind,label:f.properties.route,sub:f.properties.seg,geom:f.geometry}); });
  regions.features.forEach(function(f){ searchIndex.push({type:'reg',label:f.properties.name_ka,sub:f.properties.REGION_ENG,geom:f.geometry}); });
  var sEl=document.getElementById('search'), rEl=document.getElementById('results'), clrEl=document.getElementById('searchClr');
  function doSearch(){
    var q=sEl.value.trim().toLowerCase(); clrEl.style.display=q?'block':'none';
    if(!q){ rEl.classList.remove('on'); rEl.innerHTML=''; return; }
    var seen={},out=[];
    for(var i=0;i<searchIndex.length && out.length<24;i++){ var it=searchIndex[i];
      var hay=(it.label+' '+(it.sub||'')).toLowerCase();
      if(hay.indexOf(q)===-1) continue;
      var key=it.type+'|'+it.label; if(seen[key])continue; seen[key]=1; out.push(it);
    }
    if(!out.length){ rEl.innerHTML='<button disabled style="color:var(--muted);justify-content:center">ვერ მოიძებნა</button>'; rEl.classList.add('on'); return; }
    rEl.innerHTML=out.map(function(it,i){
      var tag=it.type==='reg'?'<span class="tag reg">რეგიონი</span>':(it.type==='sh'?'<span class="tag sh">Sh</span>':'<span class="tag intl">S</span>');
      return '<button data-i="'+i+'">'+tag+'<span>'+it.label+(it.sub?' <span style="color:var(--muted)">· '+it.sub+'</span>':'')+'</span></button>';
    }).join('');
    rEl.classList.add('on');
    rEl._out=out;
  }
  rEl.addEventListener('click',function(e){ var b=e.target.closest('button[data-i]'); if(!b)return;
    var it=rEl._out[+b.dataset.i]; if(!it)return;
    var bb=bbox(it.geom); map.fitBounds([[bb[0],bb[1]],[bb[2],bb[3]]],{padding:80,maxZoom:12,duration:800});
    rEl.classList.remove('on');
    popup(it.type,'<div class="pp"><div class="t '+(it.type==='reg'?'reg':(it.type==='sh'?'sh':'intl'))+'">'+(it.type==='reg'?'📍 ':'🛣️ ')+it.label+'</div><div class="b">'+(it.type==='reg'?'რეგიონი':'❄️ ზამთრის გზა · '+(it.type==='sh'?'შიდასახელმწიფოებრივი მარშრუტი':'საერთაშორისო მარშრუტი'))+'</div></div>',[( bb[0]+bb[2])/2,(bb[1]+bb[3])/2]);
  });
  var st; sEl.addEventListener('input',function(){clearTimeout(st);st=setTimeout(doSearch,120);});
  clrEl.addEventListener('click',function(){sEl.value='';doSearch();sEl.focus();});
  document.addEventListener('click',function(e){ if(!e.target.closest('.searchwrap')) rEl.classList.remove('on');});

  map.on('error',function(e){ if(e && e.error) console.warn('map error:',e.error.message||e.error); });
})();
</script>
</body>
</html>
